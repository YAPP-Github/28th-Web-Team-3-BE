spring:
  config:
    import: classpath:application-db.yml

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  server:
    deployment-url: ${SERVER_URL}