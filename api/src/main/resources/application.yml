spring:
  config:
    import: classpath:application-db.yml

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  server:
    deployment-url: ${SERVER_URL}

onboarding:
  version: v1
  annual-rate: 0.03
  report-uplift-percent: 15
  # 입력 월급은 세후 실수령액. 세전 경상소득 기준 통계와 비교하기 위한 gross-up 보정계수(공제율 ≈13%)
  salary-correction-factor: 1.15
  plan1:
    min: 0.15
    max: 0.30
    single: 0.15
  plan2:
    min: 0.05
    max: 0.15
    single: 0.05

mission:
  lifecycle:
    scheduler-enabled: ${MISSION_LIFECYCLE_SCHEDULER_ENABLED:true}
  generation:
    provider: ${MISSION_GENERATION_PROVIDER:mock}
    stale-running-timeout: PT10M
    recovery-interval-millis: 60000
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 50
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      safety-salt: ${OPENAI_SAFETY_SALT:}
      model: ${OPENAI_MODEL:gpt-5.6-terra}
      reasoning-effort: low
      connect-timeout: PT3S
      request-timeout: PT20S
      max-output-tokens: 2000
    recommendation:
      provider: ${MISSION_RECOMMENDATION_PROVIDER:personalized}
      semantic-provider: ${MISSION_SEMANTIC_PROVIDER:openai}
      algorithm-version: rule-v1
      normal-reduction: 1
      aggressive-reduction: 2
      normal-replacement-count: 1
      aggressive-replacement-count: 2
      exact-cooldown-days: 56
      family-cooldown-days: 28
      signal-decay-days: 84
      category-concentration-penalty: 0.04
      archetype-concentration-penalty: 0.08
      recent-category-exposure-penalty: 0.03
      exploration-bonus: 0.05
      exploration-rate: 0.20
      embedding:
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:256}
        connect-timeout: PT3S
        request-timeout: PT10S
