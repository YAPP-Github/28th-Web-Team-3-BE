name: Prod CI/CD

run-name: "Prod CI/CD: ${{ inputs.reason || github.event_name }} (@${{ github.actor }})"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  ci:
    name: Test and build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Build boot jar
        run: ./gradlew :api:bootJar

  deploy:
    name: Deploy to prod
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_SERVICE_ACCOUNT }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      SERVER_URL: ${{ vars.SERVER_URL }}
      MISSION_WORKER_SERVICE: mission-generation-worker
      MISSION_DISPATCHER_SERVICE: mission-generation-dispatcher
      MISSION_WORKER_RUNTIME_SERVICE_ACCOUNT: mission-worker-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      MISSION_DISPATCHER_RUNTIME_SERVICE_ACCOUNT: mission-dispatcher-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      MISSION_QUEUE: mission-generation
      MISSION_QUEUE_MAX_DISPATCHES_PER_SECOND: ${{ vars.MISSION_QUEUE_MAX_DISPATCHES_PER_SECOND || '4' }}
      MISSION_QUEUE_MAX_CONCURRENT_DISPATCHES: ${{ vars.MISSION_QUEUE_MAX_CONCURRENT_DISPATCHES || '4' }}
      MISSION_WORKER_MAX_INSTANCES: ${{ vars.MISSION_WORKER_MAX_INSTANCES || '4' }}
      MISSION_WORKER_HIKARI_MAXIMUM_POOL_SIZE: ${{ vars.MISSION_WORKER_HIKARI_MAXIMUM_POOL_SIZE || '2' }}
      MISSION_WORKER_HIKARI_MINIMUM_IDLE: ${{ vars.MISSION_WORKER_HIKARI_MINIMUM_IDLE || '0' }}
      NAVER_BLOG_AI_CONTEXT_COUNT: ${{ vars.NAVER_BLOG_AI_CONTEXT_COUNT || '15' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build boot jar
        run: ./gradlew :api:bootJar

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/docker
          jar_path="$(find api/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*plain.jar' -print -quit)"
          test -n "${jar_path}"
          cp "${jar_path}" build/docker/app.jar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        run: |
          docker build --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Verify and update mission queue
        shell: bash
        run: |
          set -euo pipefail
          if gcloud tasks queues describe "${MISSION_QUEUE}" --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" >/dev/null 2>&1; then
            queue_command=update
          else
            queue_command=create
          fi
          gcloud tasks queues "${queue_command}" "${MISSION_QUEUE}" \
              --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
              --max-attempts 5 --max-concurrent-dispatches "${MISSION_QUEUE_MAX_CONCURRENT_DISPATCHES}" \
              --max-dispatches-per-second "${MISSION_QUEUE_MAX_DISPATCHES_PER_SECOND}" \
              --min-backoff 10s --max-backoff 300s --quiet
          gcloud tasks queues add-iam-policy-binding "${MISSION_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
            --member "serviceAccount:${MISSION_DISPATCHER_RUNTIME_SERVICE_ACCOUNT}" \
            --role roles/cloudtasks.enqueuer --quiet
          gcloud tasks queues add-iam-policy-binding "${MISSION_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
            --member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            --role roles/cloudtasks.enqueuer --quiet
          enqueuer_role="$(gcloud tasks queues get-iam-policy "${MISSION_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
            --flatten 'bindings[].members' \
            --filter "bindings.role=roles/cloudtasks.enqueuer AND bindings.members=serviceAccount:${MISSION_DISPATCHER_RUNTIME_SERVICE_ACCOUNT}" \
            --format 'value(bindings.role)')"
          test "${enqueuer_role}" = roles/cloudtasks.enqueuer
          api_enqueuer_role="$(gcloud tasks queues get-iam-policy "${MISSION_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
            --flatten 'bindings[].members' \
            --filter "bindings.role=roles/cloudtasks.enqueuer AND bindings.members=serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            --format 'value(bindings.role)')"
          test "${api_enqueuer_role}" = roles/cloudtasks.enqueuer

      - name: Deploy mission worker
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}" \
            --service-account "${MISSION_WORKER_RUNTIME_SERVICE_ACCOUNT}" \
            --memory "1Gi" \
            --concurrency 1 \
            --max "${MISSION_WORKER_MAX_INSTANCES}" \
            --min-instances 0 \
            --cpu-boost \
            --timeout 120 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,APP_ROLE=mission-worker,AI_ACTIVATION=on,MISSION_LIFECYCLE_SCHEDULER_ENABLED=false,MISSION_GENERATION_PROVIDER_TIMEOUT=PT60S,SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=${MISSION_WORKER_HIKARI_MAXIMUM_POOL_SIZE},SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=${MISSION_WORKER_HIKARI_MINIMUM_IDLE},NAVER_BLOG_AI_CONTEXT_COUNT=${NAVER_BLOG_AI_CONTEXT_COUNT},JWT_ISSUER=yapp,JWT_AUDIENCE=yapp-client,JWT_ACCESS_TOKEN_TTL=PT3H,JWT_REFRESH_TOKEN_TTL=P14D" \
            --set-secrets "SPRING_DATABASE_URL=SPRING_DATABASE_URL:latest,SPRING_DATABASE_USERNAME=SPRING_DATABASE_USER:latest,SPRING_DATABASE_PASSWORD=SPRING_DATABASE_PASSWORD:latest,SERVER_URL=SERVER_URL:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_GENAI_API_KEY=GOOGLE_GENAI_API_KEY:latest,NAVER_BLOG_CLIENT_ID=NAVER_BLOG_CLIENT_ID:latest,NAVER_BLOG_CLIENT_SECRET=NAVER_BLOG_CLIENT_SECRET:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Deploy mission dispatcher
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$(gcloud run services describe "${MISSION_WORKER_SERVICE}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format 'value(status.url)')"
          tasks_invoker="mission-tasks-invoker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run deploy "${MISSION_DISPATCHER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}" \
            --service-account "${MISSION_DISPATCHER_RUNTIME_SERVICE_ACCOUNT}" \
            --memory "1Gi" \
            --concurrency 1 \
            --min-instances 0 \
            --timeout 300 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,APP_ROLE=mission-dispatcher,AI_ACTIVATION=off,MISSION_LIFECYCLE_SCHEDULER_ENABLED=false,MISSION_GENERATION_DELIVERY_ENABLED=true,MISSION_GENERATION_DELIVERY_PROJECT_ID=${GCP_PROJECT_ID},MISSION_GENERATION_DELIVERY_LOCATION=${GCP_REGION},MISSION_GENERATION_DELIVERY_QUEUE=${MISSION_QUEUE},MISSION_GENERATION_WORKER_URL=${worker_url},MISSION_GENERATION_TASKS_OIDC_SERVICE_ACCOUNT=${tasks_invoker},JWT_ISSUER=yapp,JWT_AUDIENCE=yapp-client,JWT_ACCESS_TOKEN_TTL=PT3H,JWT_REFRESH_TOKEN_TTL=P14D" \
            --set-secrets "SPRING_DATABASE_URL=SPRING_DATABASE_URL:latest,SPRING_DATABASE_USERNAME=SPRING_DATABASE_USER:latest,SPRING_DATABASE_PASSWORD=SPRING_DATABASE_PASSWORD:latest,SERVER_URL=SERVER_URL:latest,JWT_SECRET=JWT_SECRET:latest" \
            --no-allow-unauthenticated \
            --quiet
          gcloud run services add-iam-policy-binding "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --member "serviceAccount:${tasks_invoker}" --role roles/run.invoker --quiet

      - name: Configure mission service-level minimum instances
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --min 1 --quiet
          gcloud run services update "${MISSION_DISPATCHER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --min 0 --quiet

      - name: Configure mission dispatcher invoker
        shell: bash
        run: |
          set -euo pipefail
          scheduler_invoker="mission-scheduler-invoker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run services add-iam-policy-binding "${MISSION_DISPATCHER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --member "serviceAccount:${scheduler_invoker}" --role roles/run.invoker --quiet

      - name: Deploy public API to Cloud Run
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$(gcloud run services describe "${MISSION_WORKER_SERVICE}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format 'value(status.url)')"
          tasks_invoker="mission-tasks-invoker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --memory "1Gi" \
            --min-instances 1 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,APP_ROLE=api,AI_ACTIVATION=off,MISSION_GENERATION_DELIVERY_ENABLED=true,MISSION_GENERATION_IMMEDIATE_DELIVERY_ENABLED=true,MISSION_GENERATION_DELIVERY_PROJECT_ID=${GCP_PROJECT_ID},MISSION_GENERATION_DELIVERY_LOCATION=${GCP_REGION},MISSION_GENERATION_DELIVERY_QUEUE=${MISSION_QUEUE},MISSION_GENERATION_WORKER_URL=${worker_url},MISSION_GENERATION_TASKS_OIDC_SERVICE_ACCOUNT=${tasks_invoker},JWT_ISSUER=yapp,JWT_AUDIENCE=yapp-client,JWT_ACCESS_TOKEN_TTL=PT3H,JWT_REFRESH_TOKEN_TTL=P14D" \
            --set-secrets "SPRING_DATABASE_URL=SPRING_DATABASE_URL:latest,SPRING_DATABASE_USERNAME=SPRING_DATABASE_USER:latest,SPRING_DATABASE_PASSWORD=SPRING_DATABASE_PASSWORD:latest,SERVER_URL=SERVER_URL:latest,JWT_SECRET=JWT_SECRET:latest,POLICY_IMPORT_TOKEN=POLICY_IMPORT_TOKEN:latest" \
            --allow-unauthenticated \
            --quiet

      - name: Verify mission worker warmth configuration
        shell: bash
        run: |
          set -euo pipefail
          queue_dispatch_rate="$(gcloud tasks queues describe "${MISSION_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
            --format='value(rateLimits.maxDispatchesPerSecond)')"
          queue_concurrent_dispatches="$(gcloud tasks queues describe "${MISSION_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" \
            --format='value(rateLimits.maxConcurrentDispatches)')"
          worker_service_min="$(gcloud run services describe "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(metadata.annotations.run.googleapis.com/minScale)')"
          worker_service_max="$(gcloud run services describe "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(metadata.annotations.run.googleapis.com/maxScale)')"
          dispatcher_service_min="$(gcloud run services describe "${MISSION_DISPATCHER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(metadata.annotations.run.googleapis.com/minScale)')"
          worker_revision="$(gcloud run services describe "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(status.latestReadyRevisionName)')"
          worker_revision_min="$(gcloud run revisions describe "${worker_revision}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(metadata.annotations.autoscaling.knative.dev/minScale)')"
          worker_cpu_boost="$(gcloud run revisions describe "${worker_revision}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(metadata.annotations.run.googleapis.com/startup-cpu-boost)')"
          worker_concurrency="$(gcloud run revisions describe "${worker_revision}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(spec.containerConcurrency)')"
          worker_timeout="$(gcloud run revisions describe "${worker_revision}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(spec.timeoutSeconds)')"
          worker_env_json="$(gcloud run revisions describe "${worker_revision}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='json(spec.containers[0].env)')"
          worker_hikari_max="$(printf '%s' "${worker_env_json}" | jq -er \
            '.[] | select(.name == "SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE") | .value')"
          worker_hikari_min_idle="$(printf '%s' "${worker_env_json}" | jq -er \
            '.[] | select(.name == "SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE") | .value')"
          worker_url="$(gcloud run services describe "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --format='value(status.url)')"
          tasks_invoker="mission-tasks-invoker@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          worker_invoker_role="$(gcloud run services get-iam-policy "${MISSION_WORKER_SERVICE}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" \
            --flatten='bindings[].members' \
            --filter="bindings.role=roles/run.invoker AND bindings.members=serviceAccount:${tasks_invoker}" \
            --format='value(bindings.role)')"
          awk -v actual="${queue_dispatch_rate}" -v expected="${MISSION_QUEUE_MAX_DISPATCHES_PER_SECOND}" \
            'BEGIN { exit !(actual == expected) }'
          test "${queue_concurrent_dispatches}" = "${MISSION_QUEUE_MAX_CONCURRENT_DISPATCHES}"
          test "${worker_service_min}" = 1
          test "${worker_service_max}" = "${MISSION_WORKER_MAX_INSTANCES}"
          test "${dispatcher_service_min}" = 0
          test -z "${worker_revision_min}" || test "${worker_revision_min}" = 0
          test "${worker_cpu_boost}" = true
          test "${worker_concurrency}" = 1
          test "${worker_timeout}" = 120
          test "${worker_hikari_max}" = "${MISSION_WORKER_HIKARI_MAXIMUM_POOL_SIZE}"
          test "${worker_hikari_min_idle}" = "${MISSION_WORKER_HIKARI_MINIMUM_IDLE}"
          [[ "${worker_url}" == https://* ]]
          test "${worker_invoker_role}" = roles/run.invoker
