name: Sync GCP Secrets

run-name: "Sync GCP Secrets: ${{ inputs.environment }} (${{ inputs.reason }})"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "대상 환경"
        required: true
        type: choice
        options:
          - dev
          - prod
      reason:
        description: "동기화 사유"
        required: true
        type: string

concurrency:
  group: backend-${{ inputs.environment }}-mutation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Sync secrets (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      AI_ACTIVATION: ${{ vars.AI_ACTIVATION || 'off' }}
      POLICY_IMPORT_ENABLED: ${{ vars.POLICY_IMPORT_ENABLED || 'false' }}
      DATABASE_ISOLATION_CONFIRMED: ${{ vars.DATABASE_ISOLATION_CONFIRMED || 'false' }}
      SECRET_SYNC_SERVICE_ACCOUNT: ${{ vars.SECRET_SYNC_SERVICE_ACCOUNT }}

    steps:
      - name: Validate selected branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${TARGET_ENVIRONMENT}" == "prod" ]]; then
            expected_ref="refs/heads/main"
          else
            expected_ref="refs/heads/dev"
          fi
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "Secret sync for ${TARGET_ENVIRONMENT} must run from ${expected_ref}." >&2
            exit 1
          fi
          if [[ "${TARGET_ENVIRONMENT}" == "dev" && "${DATABASE_ISOLATION_CONFIRMED}" != "true" ]]; then
            echo "Dev secret sync requires DATABASE_ISOLATION_CONFIRMED=true." >&2
            exit 1
          fi
          if [[ "${SECRET_SYNC_SERVICE_ACCOUNT}" != *"@${GCP_PROJECT_ID}.iam.gserviceaccount.com" ]]; then
            echo "SECRET_SYNC_SERVICE_ACCOUNT must belong to the selected GCP project." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.SECRET_SYNC_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SECRET_SYNC_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Validate required GitHub Environment Secrets
        shell: bash
        env: &runtime-secrets
          SPRING_DATABASE_URL: ${{ secrets.SPRING_DATABASE_URL }}
          SPRING_DATABASE_USER: ${{ secrets.SPRING_DATABASE_USER }}
          SPRING_DATABASE_PASSWORD: ${{ secrets.SPRING_DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          NAVER_BLOG_CLIENT_ID: ${{ secrets.NAVER_BLOG_CLIENT_ID }}
          NAVER_BLOG_CLIENT_SECRET: ${{ secrets.NAVER_BLOG_CLIENT_SECRET }}
          POLICY_IMPORT_TOKEN: ${{ secrets.POLICY_IMPORT_TOKEN }}
          YOUTH_POLICY_API_KEY: ${{ secrets.YOUTH_POLICY_API_KEY }}
        run: |
          set -euo pipefail
          required=(
            SPRING_DATABASE_URL
            SPRING_DATABASE_USER
            SPRING_DATABASE_PASSWORD
            JWT_SECRET
          )
          if [[ "${AI_ACTIVATION}" == "on" ]]; then
            required+=(GOOGLE_GENAI_API_KEY NAVER_BLOG_CLIENT_ID NAVER_BLOG_CLIENT_SECRET)
          fi
          if [[ "${POLICY_IMPORT_ENABLED}" == "true" ]]; then
            required+=(POLICY_IMPORT_TOKEN YOUTH_POLICY_API_KEY)
          fi
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required GitHub Environment Secret: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Add GCP Secret Manager versions
        shell: bash
        env: *runtime-secrets
        run: |
          set -euo pipefail
          umask 077

          add_version() {
            local secret_id="$1"
            local value="$2"
            local required="$3"

            if [[ -z "${value}" ]]; then
              if [[ "${required}" == "required" ]]; then
                echo "Required secret value is empty for ${secret_id}." >&2
                exit 1
              fi
              return
            fi

            version_name="$(printf '%s' "${value}" | gcloud secrets versions add "${secret_id}" \
              --project "${GCP_PROJECT_ID}" \
              --data-file=- \
              --format='value(name)')"
            printf -- '- `%s`: `%s`\n' "${secret_id}" "${version_name##*/}" >> "${GITHUB_STEP_SUMMARY}"
          }

          add_version "SPRING_DATABASE_URL" "${SPRING_DATABASE_URL}" required
          add_version "SPRING_DATABASE_USER" "${SPRING_DATABASE_USER}" required
          add_version "SPRING_DATABASE_PASSWORD" "${SPRING_DATABASE_PASSWORD}" required
          add_version "JWT_SECRET" "${JWT_SECRET}" required
          add_version "GOOGLE_GENAI_API_KEY" "${GOOGLE_GENAI_API_KEY}" optional
          add_version "NAVER_BLOG_CLIENT_ID" "${NAVER_BLOG_CLIENT_ID}" optional
          add_version "NAVER_BLOG_CLIENT_SECRET" "${NAVER_BLOG_CLIENT_SECRET}" optional
          add_version "POLICY_IMPORT_TOKEN" "${POLICY_IMPORT_TOKEN}" optional
          add_version "YOUTH_POLICY_API_KEY" "${YOUTH_POLICY_API_KEY}" optional

          echo "GCP Secret Manager versions updated for ${TARGET_ENVIRONMENT}."
